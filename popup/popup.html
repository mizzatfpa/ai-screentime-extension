<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Screentime</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="rainbow-doodle" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <header class="header">
      <span class="header-title">AI Screentime</span>
      <span class="header-date" id="header-date"></span>
    </header>

    <div class="day-nav" aria-label="Day navigation">
      <button class="day-nav-btn" id="prev-day-btn" type="button">Prev</button>
      <span class="day-nav-date" id="selected-day-label"></span>
      <button class="day-nav-btn" id="next-day-btn" type="button">Next</button>
    </div>

    <div class="total-card">
      <div class="total-label" id="total-label">Today's Total</div>
      <div class="total-time" id="total-time">0h 0m</div>
    </div>

    <div class="platform-list" id="platform-list"></div>

    <div class="weekly-section">
      <div class="section-label">Last 7 Days</div>
      <div class="bar-chart" id="bar-chart"></div>
    </div>

    <footer class="footer">
      <button class="reset-btn" id="reset-btn" type="button">
        <span class="reset-mark" aria-hidden="true"></span>
        <span>Reset Today</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
